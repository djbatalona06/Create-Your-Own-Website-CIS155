<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12051f"/>
      <stop offset="0.65" stop-color="#4a0f6b"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- crescent moon -->
  <path d="M330 92a170 170 0 1 0 90 250 140 140 0 1 1-90-250z" fill="none" stroke="#00f0ff" stroke-width="18" filter="url(#glow)"/>
  <!-- the eye -->
  <path d="M150 266q106-96 212 0q-106 96-212 0z" fill="#f2ece0" filter="url(#glow)"/>
  <circle cx="256" cy="266" r="36" fill="#ff2bd6" filter="url(#glow)"/>
  <circle cx="256" cy="266" r="16" fill="#05010a"/>
  <rect x="262" y="250" width="10" height="10" fill="#fff"/>
  <!-- scanlines -->
  <g fill="#000" opacity="0.18">
    <rect y="390" width="512" height="6"/>
    <rect y="414" width="512" height="6"/>
    <rect y="438" width="512" height="6"/>
  </g>
</svg>
