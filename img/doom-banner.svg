<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="DOOM banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0a0a"/>
      <stop offset="1" stop-color="#0c0505"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1010"/>
      <stop offset="1" stop-color="#180808"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="260" fill="url(#sky)"/>

  <!-- Jagged hellish horizon -->
  <polygon points="0,180 90,150 170,185 250,145 340,180 430,150 520,190 620,150 710,185 800,155 800,260 0,260"
           fill="url(#ground)"/>

  <!-- Scattered stars / embers -->
  <g fill="#ff6a3c">
    <circle cx="120" cy="40" r="2"/>
    <circle cx="300" cy="60" r="1.5"/>
    <circle cx="520" cy="35" r="2"/>
    <circle cx="680" cy="70" r="1.5"/>
    <circle cx="420" cy="30" r="1.5"/>
  </g>

  <!-- Title text (original lettering, not the trademarked logo) -->
  <text x="400" y="130" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="96" font-weight="bold"
        fill="#c81e1e" stroke="#000000" stroke-width="3"
        letter-spacing="10">DOOM</text>

  <!-- Subtitle -->
  <text x="400" y="165" text-anchor="middle"
        font-family="Georgia, serif" font-size="20"
        fill="#e8e0d5" letter-spacing="6">CAN IT RUN IT?</text>
</svg>
